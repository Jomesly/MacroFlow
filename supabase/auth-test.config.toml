# Disposable integration-test project. Never link this directory to a hosted project.
project_id = "macroflow-auth-tests"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3137"
additional_redirect_urls = ["http://localhost:3137/auth/confirm"]
jwt_expiry = 300
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m"

[auth.email.template.confirmation]
subject = "Confirm MacroFlow email"
content_path = "./supabase/templates/confirmation-test.html"

[auth.email.template.recovery]
subject = "Reset MacroFlow password"
content_path = "./supabase/templates/recovery-test.html"
